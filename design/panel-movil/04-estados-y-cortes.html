<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog · states and cuts</title><style>
:root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a323c;--text:#d7dde5;--muted:#8b96a3;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--purple:#a371f7;--gray:#6e7681}
*{box-sizing:border-box}
body{margin:0;background:#0b0e12;color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
button,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--blue)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:ui-monospace,Consolas,monospace}
.board{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:26px 22px 0}
.fig{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{max-width:380px;color:var(--muted);font-size:12.5px;margin:0;text-align:left}
.cap b{color:var(--text)}
.title{margin:0;padding:14px 26px 0;font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.title b{color:var(--text)}
/* the phone */
.ph{width:390px;height:780px;border:1px solid var(--line);border-radius:30px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 6px #12161b}
.ph.w360{width:360px}.ph.tab{width:820px;height:600px;border-radius:20px}
.sb{display:flex;justify-content:space-between;padding:8px 22px 2px;font-size:12px;color:var(--muted)}
.mh{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:52px;border-bottom:1px solid var(--line)}
.mh b{font-size:15px}.mh .sp{flex:1}.mh .n{color:var(--muted);font-size:12px}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:10px;position:relative}
.ib:hover:not(:disabled){color:var(--text);border-color:var(--line)}
.ib .dot{position:absolute;top:8px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.mc{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:hidden}
/* bottom bar */
.bb{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:8px}
.bb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;border-top:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-size:11.5px;position:relative}
.bb button[aria-current=page]{color:var(--text);border-top-color:var(--blue)}
.bb .bd{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--yellow);color:#06101c;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bb .bd.r{background:var(--red);color:#fff}
/* repo cards */
.cards{padding:10px 12px;display:grid;gap:8px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px;min-height:44px}
.card.on{border-color:var(--blue);background:#12253d}
.card b{font-size:14px}.card small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .r1{display:flex;justify-content:space-between;gap:8px}.card .st{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:#3a424d;overflow:hidden;display:flex}.bar i{display:block;background:var(--green)}.bar i.b{background:var(--blue)}.bar i.r{background:var(--red)}.bar i.y{background:var(--yellow)}
.grp{padding:8px 14px 0;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
/* chat */
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow:hidden}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 12px;min-height:44px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--blue)}
.tabs .x{padding:0;min-width:32px;min-height:44px;color:var(--muted)}
.vt{display:flex;align-items:center}
.msgs{padding:12px;display:grid;gap:10px;align-content:start}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.msg.me{background:#12253d;border-color:#1d3a5f;margin-left:34px}
.msg code{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);border-radius:4px;padding:0 4px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.comp{border-top:1px solid var(--line);background:var(--panel);padding:8px 10px;display:grid;gap:6px}
.comp .in{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:13.5px}
.comp .in .sp{flex:1}
.code{padding:8px 0;font:12px/1.55 ui-monospace,Consolas,monospace}
.code div{display:flex;gap:10px;padding:0 10px;white-space:nowrap;overflow:hidden}.code .nn{width:26px;text-align:right;color:var(--gray);flex:none}.code .e{background:#2a2410}.code .k{color:#ff7b72}.code .s{color:#a5d6ff}.code .c{color:var(--gray)}
.vh{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}.vh b{color:var(--text);font-weight:600}
.pad{padding:10px 12px;font-size:13.5px;color:var(--text);display:grid;gap:8px;align-content:start}.pad .sv{color:var(--muted);font-size:12px}
/* repo zone */
.ctabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.ctabs button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-size:13px;padding:0 4px;position:relative}
.ctabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--blue)}
.ctabs .lb{display:none}.ctabs button[aria-selected=true] .lb{display:inline}
.ctabs .n{font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}.ctabs .n.y{background:var(--yellow);border-color:var(--yellow);color:#06101c;font-weight:700}
.sum{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}.sum .a{color:var(--green)}.sum .d{color:var(--red)}
.tr{display:flex;align-items:center;gap:8px;padding:0 14px 0 calc(14px + var(--d,0)*24px);min-height:44px;font-size:14px}
.tr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tr.dir{color:var(--muted)}
.tr .L{width:16px;text-align:center;font-weight:700;font-size:12px}.L.M{color:var(--yellow)}.L.U{color:var(--green)}
.tr .pm{color:var(--muted);font-size:12px}.tr .pm .a{color:var(--green)}.tr .pm .d{color:var(--red)}
.tr.mod .nm{color:#e3b341}.tr.sel{background:#12253d}
.st-pr{padding:12px 14px;display:grid;gap:4px}.st-pr .t{display:flex;gap:8px;align-items:center}.st-pr .ti{font-size:14px}.st-pr .mt{color:var(--muted);font-size:12px}
.ck-sum{display:flex;gap:14px;padding:8px 14px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.ck-r{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:44px;font-size:14px;border-top:1px solid var(--line)}.ck-r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ck-r .s{color:var(--muted);font-size:12px}
.ok{color:var(--green)}.pe{color:var(--yellow)}.fa{color:var(--red)}
.pe svg{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.foot{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg);font-size:13px}
.foot .br{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--muted)}.foot .br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;font-weight:600;border:1px solid #238636;background:#238636;color:#fff;white-space:nowrap}
.go:hover:not(:disabled){background:#2ea043;border-color:#2ea043}
.go:disabled{background:var(--panel2);border-color:var(--line);color:var(--muted);opacity:1}
.tk{padding:12px 14px;display:grid;gap:8px}.tk-bar{height:8px;border-radius:4px;background:#3a424d;overflow:hidden;display:flex}.tk-bar i{display:block}.tk-leg{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px}
.tk-row{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13.5px}.tk-row .id{color:var(--muted);font-size:12px}
.tk-fold{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;color:var(--muted);background:transparent;border:0;width:100%;text-align:left}
/* sheets */
.dim{position:absolute;inset:0;background:rgba(5,8,12,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.grab{width:40px;height:4px;border-radius:2px;background:var(--gray);margin:8px auto 4px}
.note{margin:0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px}
.why{font-size:12.5px;color:var(--muted);padding:0 14px}.why.y{color:var(--yellow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
