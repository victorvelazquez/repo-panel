*{box-sizing:border-box}
body{margin:0;background:#0b0e12;color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}

.mono{font-family:ui-monospace,Consolas,monospace}
.board{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:26px 22px 0}

.mc{flex:1;min-height:0;display:flex;flex-direction:column}

.card .r1{display:flex;justify-content:space-between;gap:8px}.card .st{font-size:12px;color:var(--muted)}

.vt{display:flex;align-items:center}

.comp{border-top:1px solid var(--line);background:var(--panel);padding:8px 10px;display:grid;gap:6px}

.comp .in .sp{flex:1}

.pad{padding:10px 12px;font-size:13.5px;color:var(--text);display:grid;gap:8px;align-content:start}.pad .sv{color:var(--muted);font-size:12px}

.ctabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--blue)}

.tr .L{width:16px;text-align:center;font-weight:700;font-size:12px}.L.M{color:var(--yellow)}.L.U{color:var(--green)}
.tr .pm{color:var(--muted);font-size:12px}.tr .pm .a{color:var(--green)}.tr .pm .d{color:var(--red)}

.tk-row{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13.5px}.tk-row .id{color:var(--muted);font-size:12px}

.dim{position:absolute;inset:0;background:rgba(5,8,12,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.grab{width:40px;height:4px;border-radius:2px;background:var(--gray);margin:8px auto 4px}
.note{margin:0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12.5px}
.why{font-size:12.5px;color:var(--muted);padding:0 14px}.why.y{color:var(--yellow)}
