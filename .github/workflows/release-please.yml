name: Release Please

on:
  push:
    branches: [main]

# Needed to open the release PR and, once it is merged, to create the tag and the GitHub release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so the
          # required CI checks would never run on the release PR. A personal token in
          # RELEASE_PLEASE_TOKEN avoids that; without it the action falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
